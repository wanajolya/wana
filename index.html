<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تحويل مباشر</title>
    <script>
        // بنقرا المسار الكامل اللي العضو كتبه بعد اسم موقعك
        let fullPath = window.location.href;
        
        // بنبحث عن رابط الصورة الموجود جوه الرابط نفسه
        let splitIndex = fullPath.indexOf("http", 8);
        let targetUrl = splitIndex !== -1 ? fullPath.substring(splitIndex) : "https://images.app.goo.gl/UeieYqv4rGmwTHg9A";

        // بنشوف هل اللي فاتح الرابط بوت (فيسبوك) ولا زائر بشري
        let userAgent = navigator.userAgent || "";
        let isBot = /facebookexternalhit|Facebot|Twitterbot|Googlebot|LinkedInBot|WhatsApp|Bluesky|MetaInspector|bot|crawler|spider|scraper/i.test(userAgent);

        if (isBot) {
            // لو بوت فيسبوك، بنحقن رابط الصورة مباشرة في الـ Meta عشان تظهر المعاينة الكبيرة
            document.write(`
                <!DOCTYPE html>
                <html lang="ar">
                <head>
                    <meta charset="UTF-8">
                    <title>معاينة الصورة</title>
                    <meta property="og:title" content="صورة جديدة" />
                    <meta property="og:image" content="${targetUrl}" />
                    <meta property="og:url" content="${targetUrl}" />
                    <meta property="og:type" content="website" />
                    <meta http-equiv="refresh" content="0;url=${targetUrl}">
                </head>
                <body></body>
                </html>
            `);
        } else {
            // لو زائر حقيقي، بيحوله للصورة أو الرابط المطلوب في ثانية
            window.location.replace(targetUrl);
        }
    </script>
</head>
<body>
    <p>جاري التحويل...</p>
</body>
</html>
